<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#140a1f">
<title>Prophecy</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #140a1f;
    --surface: #20102f;
    --surface2: #2b1740;
    --ink: #fbeefb;
    --muted: #b79ac9;
    --line: #4a2a63;
    --soft-line: #3a2150;
    --pink: #ff4fa3;
    --gold: #ffd166;
    --green: #3ddc97;
    --red: #ff6b6b;
    --violet: #b79cff;
    --on-pink: #2a0a1e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    color: var(--ink);
    background:
      radial-gradient(900px 500px at 8% -10%, rgba(255,79,163,.28), transparent 60%),
      radial-gradient(800px 500px at 100% 0%, rgba(124,92,255,.28), transparent 60%),
      var(--bg);
    background-attachment: fixed;
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: env(safe-area-inset-top) 16px calc(28px + env(safe-area-inset-bottom));
    -webkit-text-size-adjust: 100%;
  }

  /* ---------- title ---------- */
  .brand { display: flex; align-items: center; gap: 12px; margin: 22px 0 6px; }
  h1 {
    margin: 0; font-size: 34px; line-height: 1; letter-spacing: .08em; text-transform: uppercase; font-weight: 900;
    background: linear-gradient(90deg, var(--pink), var(--gold)); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .suits { font-size: 22px; letter-spacing: .15em; white-space: nowrap; }
  .suits .r { color: var(--pink); }
  .sub { color: var(--ink); font-size: 20px; font-weight: 700; margin: 4px 0 20px; }
  .sub .wave { display: inline-block; animation: wobble 2.4s ease-in-out infinite; transform-origin: 70% 70%; }
  @keyframes wobble { 0%,100% { transform: rotate(0); } 10%,30% { transform: rotate(-8deg); } 20%,40% { transform: rotate(8deg); } 50% { transform: rotate(0); } }

  /* ---------- setup ---------- */
  .card {
    background: linear-gradient(180deg, var(--surface2), var(--surface)); border: 1px solid var(--line);
    border-radius: 18px; padding: 22px; max-width: 480px; box-shadow: 0 18px 50px rgba(0,0,0,.45);
  }
  label.field { display: block; font-weight: 700; margin: 20px 0 8px; color: var(--violet); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; }
  label.field:first-child { margin-top: 0; }
  .counts { display: flex; flex-wrap: wrap; gap: 8px; }
  .counts button {
    width: 46px; height: 46px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg);
    color: var(--ink); font: inherit; font-size: 18px; font-weight: 800; cursor: pointer; transition: transform .12s, background .12s;
  }
  .counts button:hover { transform: translateY(-2px); }
  .counts button[aria-pressed="true"] { background: linear-gradient(135deg, var(--pink), #ff7a59); border-color: transparent; color: var(--on-pink); box-shadow: 0 6px 18px rgba(255,79,163,.45); }
  .names { display: grid; gap: 10px; }
  .names .nrow { display: flex; align-items: center; gap: 10px; }
  .names input, .pw {
    width: 100%; padding: 13px 14px; font: inherit; border-radius: 12px;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink);
  }
  .names input::placeholder { color: #7d6591; }
  .names input:focus, .pw:focus { outline: 2px solid var(--pink); outline-offset: 1px; }
  .primary {
    margin-top: 24px; width: 100%; padding: 15px; border: 0; border-radius: 14px; font: inherit; font-size: 17px; font-weight: 800;
    letter-spacing: .03em; color: var(--on-pink); cursor: pointer;
    background: linear-gradient(135deg, var(--pink), var(--gold)); box-shadow: 0 10px 26px rgba(255,79,163,.4); transition: transform .12s;
  }
  .primary:hover { transform: translateY(-2px); }
  .primary:active { transform: translateY(0); }
  .hint { color: var(--muted); font-size: 13px; margin: 8px 0 0; }
  .err { color: var(--red); font-size: 14px; font-weight: 700; margin: 8px 0 0; }
  .ghost {
    padding: 9px 16px; border-radius: 12px; border: 1px solid var(--line); background: rgba(255,255,255,.04);
    color: var(--ink); font: inherit; font-weight: 700; cursor: pointer;
  }
  .ghost:hover { border-color: var(--pink); }

  /* ---------- game header ---------- */
  .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 14px 0 12px; }
  .toolbar .brand { margin: 0; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 14px; font-size: 12px; font-weight: 700; }
  .chip { padding: 4px 10px; border-radius: 99px; border: 1px solid var(--line); background: rgba(255,255,255,.04); color: var(--muted); }
  .chip.p { color: var(--violet); border-color: rgba(183,156,255,.4); }
  .chip.a { color: var(--pink); border-color: rgba(255,79,163,.4); }
  .chip.t { color: var(--gold); border-color: rgba(255,209,102,.4); }

  /* ---------- standings ---------- */
  #standings { display: flex; gap: 10px; overflow-x: auto; padding: 2px 2px 14px; margin: 0 -2px; scrollbar-width: none; }
  #standings::-webkit-scrollbar { display: none; }
  .stand {
    flex: none; display: flex; align-items: center; gap: 10px; padding: 8px 14px 8px 8px; border-radius: 16px;
    background: var(--surface); border: 1px solid var(--line); transition: transform .3s, border-color .3s;
  }
  .stand .medal { font-size: 20px; width: 24px; text-align: center; }
  .stand .nm { font-weight: 800; line-height: 1.1; max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stand .pts { font-size: 13px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .stand .pts.pos { color: var(--green); } .stand .pts.neg { color: var(--red); } .stand .pts.zero { color: var(--muted); }
  .stand.first { border-color: var(--gold); box-shadow: 0 0 0 1px rgba(255,209,102,.4), 0 8px 24px rgba(255,209,102,.18); }
  .avatar {
    flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
    font-weight: 900; font-size: 16px; color: #1b0f26; background: var(--pc, var(--pink)); box-shadow: inset 0 -3px 0 rgba(0,0,0,.18);
  }

  /* ---------- winner ---------- */
  #winner {
    text-align: center; margin: 0 0 16px; padding: 16px; border-radius: 18px; font-size: 20px; font-weight: 900;
    background: linear-gradient(135deg, rgba(255,209,102,.25), rgba(255,79,163,.25)); border: 1px solid var(--gold);
    animation: pop .5s ease-out;
  }
  #winner small { display: block; font-size: 14px; font-weight: 700; color: var(--muted); margin-top: 2px; }
  #confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 50; }
  #confetti i { position: absolute; top: -20px; width: 9px; height: 14px; border-radius: 2px; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); opacity: .9; } }

  /* ---------- table ---------- */
  .wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); box-shadow: 0 18px 50px rgba(0,0,0,.45); }
  table { border-collapse: separate; border-spacing: 0; width: 100%; }
  th, td { border-right: 1px solid var(--soft-line); border-bottom: 1px solid var(--soft-line); padding: 0; }
  thead th {
    background: var(--surface2); color: var(--ink); padding: 10px 0 8px; text-align: center; position: relative;
    font-size: 24px; font-weight: 900; line-height: 1; border-bottom: 2px solid var(--line);
  }
  thead th .suit { position: absolute; top: 5px; left: 7px; font-size: 11px; opacity: .8; }
  thead th .suit.r { color: var(--pink); }
  thead th small { display: block; margin-top: 3px; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  thead th.corner { position: sticky; left: 0; z-index: 3; text-align: left; padding-left: 14px; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); min-width: 132px; }
  thead th.now { background: linear-gradient(180deg, rgba(255,79,163,.55), rgba(255,79,163,.2)); }
  thead th.now small { color: var(--gold); font-size: 11px; font-weight: 900; }
  thead th.now small::before { content: "NOW \00b7  "; }
  thead th.final { min-width: 86px; color: var(--gold); border-left: 2px solid var(--line); border-right: 0; }
  th.name {
    position: sticky; left: 0; z-index: 2; background: var(--surface); text-align: left;
    padding: 0 12px; border-right: 2px solid var(--line); min-width: 132px; max-width: 170px;
  }
  .who { display: flex; align-items: center; gap: 9px; }
  .who .nm { font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .who .rk { margin-left: auto; font-size: 15px; }
  tbody tr { --pc: var(--pink); }
  tbody th.name { box-shadow: inset 4px 0 0 var(--pc); }
  tr:last-child th.name, tr:last-child td { border-bottom: 0; }
  td.cell-td { min-width: 108px; transition: background .25s; }
  td.now { background: rgba(255,79,163,.07); }
  .cell { display: flex; height: 78px; position: relative; }
  .inputs { display: flex; flex-direction: column; width: 48px; flex: none; padding: 6px 0 6px 6px; gap: 4px; }
  .inputs input {
    flex: 1; min-height: 0; width: 100%; border: 1px solid var(--line); background: var(--bg); color: var(--ink);
    text-align: center; font: inherit; font-size: 18px; font-weight: 900; padding: 0; border-radius: 9px;
    -moz-appearance: textfield; appearance: textfield; transition: border-color .15s, box-shadow .15s;
  }
  .inputs input::-webkit-outer-spin-button, .inputs input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .inputs input.p { color: var(--violet); }
  .inputs input.a { color: var(--pink); }
  .inputs input:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px rgba(255,209,102,.3); }
  .inputs input::placeholder { color: #6d5681; font-weight: 700; font-size: 10px; letter-spacing: .06em; text-transform: uppercase; }
  .inputs input[readonly] { cursor: pointer; }
  .inputs input.p[readonly] { background: rgba(183,156,255,.12); border-color: rgba(183,156,255,.35); }
  .inputs input.a[readonly] { background: repeating-linear-gradient(135deg, transparent 0 5px, rgba(255,255,255,.05) 5px 6px), var(--bg); opacity: .5; }
  .total { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-variant-numeric: tabular-nums; }
  .total .tv { font-size: 22px; font-weight: 900; line-height: 1; }
  .total .delta { font-size: 11px; font-weight: 800; padding: 1px 7px; border-radius: 99px; background: rgba(255,255,255,.08); }
  .total.pos .tv { color: var(--green); } .total.neg .tv { color: var(--red); }
  .total.pos .delta { color: var(--green); background: rgba(61,220,151,.15); }
  .total.neg .delta { color: var(--red); background: rgba(255,107,107,.15); }
  .total.pop { animation: pop .45s ease-out; }
  @keyframes pop { 0% { transform: scale(.7); opacity: .2; } 60% { transform: scale(1.18); } 100% { transform: scale(1); opacity: 1; } }
  td.hit { background: linear-gradient(135deg, rgba(61,220,151,.22), rgba(61,220,151,.05)); }
  td.miss { background: linear-gradient(135deg, rgba(255,107,107,.2), rgba(255,107,107,.04)); }
  td.hit .cell::after { content: "\2713"; position: absolute; top: 3px; right: 6px; font-size: 11px; font-weight: 900; color: var(--green); }
  td.final { min-width: 86px; text-align: center; font-size: 24px; font-weight: 900; border-left: 2px solid var(--line); border-right: 0; font-variant-numeric: tabular-nums; }
  td.final.pos { color: var(--green); } td.final.neg { color: var(--red); }
  td.final.leader { background: linear-gradient(180deg, rgba(255,209,102,.28), rgba(255,209,102,.08)); color: var(--gold); text-shadow: 0 0 18px rgba(255,209,102,.6); }
  td.final .crown { display: block; font-size: 15px; line-height: 1; margin-bottom: 2px; }
  .lockbtn {
    display: block; margin: 5px auto 0; padding: 2px 9px; font: inherit; font-size: 10px; font-weight: 800; letter-spacing: .05em;
    border-radius: 99px; border: 1px solid var(--violet); background: rgba(183,156,255,.15); color: var(--violet); cursor: pointer;
  }
  .lockbtn.open { border-color: var(--gold); background: rgba(255,209,102,.15); color: var(--gold); }

  /* ---------- dialog ---------- */
  dialog {
    border: 1px solid var(--line); border-radius: 18px; background: var(--surface); color: var(--ink);
    padding: 22px; width: min(92vw, 380px);
  }
  dialog::backdrop { background: rgba(10, 4, 16, .7); backdrop-filter: blur(3px); }
  dialog h2 { margin: 0 0 6px; font-size: 20px; }
  dialog p { margin: 0 0 12px; color: var(--muted); }
  dialog .row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; }
  dialog .primary { margin: 0; width: auto; padding: 10px 20px; font-size: 15px; }
  .hidden { display: none !important; }

  .ghost { white-space: nowrap; }
  @media (max-width: 480px) {
    h1 { font-size: 26px; } .suits { display: none; }
    th.name, thead th.corner { min-width: 92px; max-width: 108px; padding-left: 8px; padding-right: 6px; }
    .who { gap: 6px; } .who .avatar { width: 26px; height: 26px; font-size: 13px; } .who .nm { font-size: 14px; }
    .who .rk { display: none; }
    td.cell-td { min-width: 100px; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } #confetti { display: none; } }
</style>
</head>
<body>

<section id="setup" class="hidden">
  <div class="brand"><h1>Prophecy</h1><span class="suits" aria-hidden="true">&spades; <span class="r">&hearts;</span> &clubs; <span class="r">&diams;</span></span></div>
  <p class="sub">Set up the game Gay Boyeeee! <span class="wave">&#128075;</span></p>
  <div class="card">
    <label class="field" id="count-label">How many players?</label>
    <div class="counts" id="counts" role="group" aria-labelledby="count-label"></div>
    <label class="field">Names</label>
    <div class="names" id="names"></div>
    <label class="field" for="admin-pw">Admin password</label>
    <input class="pw" id="admin-pw" type="password" autocomplete="new-password" maxlength="64">
    <p class="hint">Needed to change a prophecy after it locks. Only the scorekeeper should know it.</p>
    <p class="err hidden" id="setup-err" role="alert"></p>
    <button class="primary" id="start" type="button">Deal me in</button>
  </div>
</section>

<section id="game" class="hidden">
  <div class="toolbar">
    <div class="brand"><h1>Prophecy</h1><span class="suits" aria-hidden="true">&spades; <span class="r">&hearts;</span> &clubs; <span class="r">&diams;</span></span></div>
    <button class="ghost" id="reset" type="button">New game</button>
  </div>
  <div class="legend" aria-label="How to read each box">
    <span class="chip p">top: prophecy</span><span class="chip a">bottom: actual</span><span class="chip t">right: running total</span>
  </div>
  <div id="winner" class="hidden"></div>
  <div id="standings" aria-label="Standings"></div>
  <div class="wrap"><table id="board"></table></div>
</section>

<div id="confetti" aria-hidden="true"></div>

<dialog id="admin-dlg">
  <form id="admin-form">
    <h2 id="admin-title">Admin override</h2>
    <p id="admin-msg"></p>
    <input class="pw" id="admin-input" type="password" autocomplete="off" maxlength="64" aria-label="Admin password">
    <p class="err hidden" id="admin-err" role="alert">Wrong password</p>
    <div class="row">
      <button class="ghost" id="admin-cancel" type="button">Cancel</button>
      <button class="primary" type="submit">Unlock</button>
    </div>
  </form>
</dialog>

<script>
(function () {
  var STORE = 'prophecy-game-v1';
  var ROUNDS = [8, 7, 6, 5, 4, 3, 2, 1];
  var MAX_PLAYERS = 8, MIN_PLAYERS = 2;
  var COLORS = ['#ff4fa3', '#ffd166', '#3ddc97', '#4cc9f0', '#b79cff', '#ff8a4c', '#f15bb5', '#9ef01a'];
  var SUITS = ['♠', '♥', '♣', '♦'];   // spade, heart, club, diamond

  var game = null;       // { names: [], p: [[...8]], a: [[...8]], salt, pwHash, unlocked: [8] }  null = not yet entered
  var setupCount = 4;
  var firstPaint = true;
  var lastWinnerKey = null;

  var $ = function (id) { return document.getElementById(id); };

  function save() { try { localStorage.setItem(STORE, JSON.stringify(game)); } catch (e) {} }
  function load() {
    try {
      var g = JSON.parse(localStorage.getItem(STORE));
      if (g && g.names && g.p && g.a) return g;
    } catch (e) {}
    return null;
  }

  // Exact hit: +10 x prophecy. Miss: -10 x |difference|.
  function roundScore(p, a) { return p === a ? 10 * p : -10 * Math.abs(p - a); }

  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function fmt(n) { return (n > 0 ? '+' : '') + n; }
  function initial(name) { return (name.trim().charAt(0) || '?').toUpperCase(); }

  /* ---------- setup ---------- */
  function renderSetup() {
    var counts = $('counts');
    counts.innerHTML = '';
    for (var n = MIN_PLAYERS; n <= MAX_PLAYERS; n++) {
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = n;
      b.setAttribute('aria-pressed', n === setupCount);
      b.addEventListener('click', (function (n) { return function () { setupCount = n; renderSetup(); }; })(n));
      counts.appendChild(b);
    }
    var names = $('names');
    var existing = Array.prototype.map.call(names.querySelectorAll('input'), function (i) { return i.value; });
    names.innerHTML = '';
    for (var i = 0; i < setupCount; i++) {
      var row = document.createElement('div');
      row.className = 'nrow';
      var av = document.createElement('span');
      av.className = 'avatar';
      av.style.setProperty('--pc', COLORS[i]);
      av.textContent = i + 1;
      var inp = document.createElement('input');
      inp.type = 'text';
      inp.maxLength = 20;
      inp.placeholder = 'Player ' + (i + 1);
      inp.autocomplete = 'off';
      inp.setAttribute('aria-label', 'Player ' + (i + 1) + ' name');
      inp.value = existing[i] || '';
      row.appendChild(av);
      row.appendChild(inp);
      names.appendChild(row);
    }
  }

  // Salted SHA-256 of the admin password. The password itself is never stored.
  function hashPw(pw, salt) {
    var data = salt + ':' + pw;
    if (window.crypto && crypto.subtle && window.TextEncoder) {
      return crypto.subtle.digest('SHA-256', new TextEncoder().encode(data)).then(function (b) {
        return Array.prototype.map.call(new Uint8Array(b), function (x) { return ('0' + x.toString(16)).slice(-2); }).join('');
      });
    }
    var h = 5381;
    for (var i = 0; i < data.length; i++) h = ((h << 5) + h + data.charCodeAt(i)) | 0;
    return Promise.resolve('f' + h);
  }
  function newSalt() { return Math.random().toString(36).slice(2) + Date.now().toString(36); }

  function startGame() {
    var pw = $('admin-pw').value;
    var err = $('setup-err');
    if (!pw) { err.textContent = 'Choose an admin password.'; err.classList.remove('hidden'); $('admin-pw').focus(); return; }
    err.classList.add('hidden');
    var inputs = $('names').querySelectorAll('input');
    var names = Array.prototype.map.call(inputs, function (inp, i) { return inp.value.trim() || ('Player ' + (i + 1)); });
    var salt = newSalt();
    hashPw(pw, salt).then(function (hash) {
      game = { names: names, p: [], a: [], salt: salt, pwHash: hash, unlocked: Array(8).fill(false) };
      names.forEach(function () { game.p.push(Array(8).fill(null)); game.a.push(Array(8).fill(null)); });
      $('admin-pw').value = '';
      save();
      show('game');
      renderBoard();
    });
  }

  /* ---------- board ---------- */
  function totals(pi) {
    // running totals across completed rounds, in play order (8 down to 1)
    var run = 0, out = [];
    for (var r = 0; r < 8; r++) {
      var p = game.p[pi][r], a = game.a[pi][r];
      if (p !== null && a !== null) { run += roundScore(p, a); out.push(run); }
      else out.push(null);
    }
    return { cells: out, final: run };
  }

  function renderBoard() {
    var t = $('board');
    var html = '<thead><tr><th class="corner">Players</th>';
    ROUNDS.forEach(function (c, r) {
      var red = (r % 4 === 1 || r % 4 === 3) ? ' r' : '';
      html += '<th scope="col" data-hr="' + r + '"><span class="suit' + red + '" aria-hidden="true">' + SUITS[r % 4] + '</span>' + c +
        '<small>cards</small><button type="button" class="lockbtn hidden" data-r="' + r + '"></button></th>';
    });
    html += '<th class="final" scope="col">Total</th></tr></thead><tbody>';
    game.names.forEach(function (name, pi) {
      html += '<tr data-pi="' + pi + '" style="--pc:' + COLORS[pi % COLORS.length] + '"><th class="name" scope="row"></th>';
      ROUNDS.forEach(function (c, r) {
        html += '<td class="cell-td" data-r="' + r + '"><div class="cell">' +
          '<div class="inputs">' +
          '<input class="p" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" placeholder="pro" aria-label="' + esc(name) + ' prophecy, ' + c + ' cards" data-pi="' + pi + '" data-r="' + r + '" data-k="p">' +
          '<input class="a" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" placeholder="act" aria-label="' + esc(name) + ' actual, ' + c + ' cards" data-pi="' + pi + '" data-r="' + r + '" data-k="a">' +
          '</div><div class="total"></div></div></td>';
      });
      html += '<td class="final"></td></tr>';
    });
    html += '</tbody>';
    t.innerHTML = html;

    // names via textContent (avoid injecting HTML)
    t.querySelectorAll('tbody tr').forEach(function (tr) {
      var pi = +tr.dataset.pi;
      var th = tr.querySelector('th.name');
      th.title = game.names[pi];
      var who = document.createElement('div'); who.className = 'who';
      var av = document.createElement('span'); av.className = 'avatar'; av.textContent = initial(game.names[pi]);
      var nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = game.names[pi];
      var rk = document.createElement('span'); rk.className = 'rk';
      who.appendChild(av); who.appendChild(nm); who.appendChild(rk);
      th.appendChild(who);
      ROUNDS.forEach(function (c, r) {
        var p = game.p[pi][r], a = game.a[pi][r];
        tr.querySelector('input[data-r="' + r + '"][data-k="p"]').value = p === null ? '' : p;
        tr.querySelector('input[data-r="' + r + '"][data-k="a"]').value = a === null ? '' : a;
      });
    });
    firstPaint = true;
    refreshTotals();
    firstPaint = false;
  }

  function prophecyComplete(r) { return game.p.every(function (row) { return row[r] !== null; }); }
  function roundComplete(r) { return prophecyComplete(r) && game.a.every(function (row) { return row[r] !== null; }); }

  // Actuals stay read-only until every prophecy for the round is in; then the prophecies lock.
  function refreshLocks() {
    if (!game.unlocked) game.unlocked = Array(8).fill(false);
    ROUNDS.forEach(function (c, r) {
      var done = prophecyComplete(r);
      var un = !!game.unlocked[r];
      var pLocked = done && !un;
      $('board').querySelectorAll('input[data-r="' + r + '"][data-k="p"]').forEach(function (el) { el.readOnly = pLocked; });
      $('board').querySelectorAll('input[data-r="' + r + '"][data-k="a"]').forEach(function (el) {
        el.readOnly = !(done || un);
        el.placeholder = (done || un) ? 'act' : '';
      });
      var btn = $('board').querySelector('.lockbtn[data-r="' + r + '"]');
      btn.classList.toggle('hidden', !(pLocked || un));
      btn.classList.toggle('open', un);
      btn.textContent = un ? '\u{1F513} Re-lock' : '\u{1F512} Locked';
      btn.title = un ? 'Lock this round again' : 'Enter the admin password to edit prophecies';
    });
  }

  function refreshTotals() {
    refreshLocks();
    var finals = [];
    game.names.forEach(function (_, pi) {
      var tr = $('board').querySelector('tr[data-pi="' + pi + '"]');
      var tt = totals(pi);
      finals.push(tt.final);
      ROUNDS.forEach(function (c, r) {
        var td = tr.querySelector('td[data-r="' + r + '"]');
        var box = td.querySelector('.total');
        var v = tt.cells[r];
        td.classList.remove('hit', 'miss');
        box.classList.remove('pos', 'neg');
        var sig = v === null ? '' : String(v) + '|' + game.p[pi][r] + '|' + game.a[pi][r];
        var changed = box.dataset.sig !== sig;
        box.dataset.sig = sig;
        if (v === null) { box.textContent = ''; return; }
        var d = roundScore(game.p[pi][r], game.a[pi][r]);
        box.innerHTML = '<span class="tv">' + v + '</span><span class="delta">' + fmt(d) + '</span>';
        if (v > 0) box.classList.add('pos'); else if (v < 0) box.classList.add('neg');
        td.classList.add(game.p[pi][r] === game.a[pi][r] ? 'hit' : 'miss');
        td.title = 'Round score ' + fmt(d);
        if (changed && !firstPaint) { box.classList.remove('pop'); void box.offsetWidth; box.classList.add('pop'); }
      });
      var fin = tr.querySelector('td.final');
      fin.textContent = tt.final;
      fin.classList.toggle('pos', tt.final > 0);
      fin.classList.toggle('neg', tt.final < 0);
    });

    var anyPlayed = game.p.some(function (row, pi) { return row.some(function (v, r) { return v !== null && game.a[pi][r] !== null; }); });
    var best = Math.max.apply(null, finals);
    var order = game.names.map(function (_, i) { return i; }).sort(function (x, y) { return finals[y] - finals[x] || x - y; });
    var rankOf = {};
    order.forEach(function (pi, i) { rankOf[pi] = i > 0 && finals[pi] === finals[order[i - 1]] ? rankOf[order[i - 1]] : i; });
    var MEDALS = ['\u{1F947}', '\u{1F948}', '\u{1F949}'];

    game.names.forEach(function (_, pi) {
      var tr = $('board').querySelector('tr[data-pi="' + pi + '"]');
      var td = tr.querySelector('td.final');
      var lead = anyPlayed && finals[pi] === best;
      td.classList.toggle('leader', lead);
      if (lead) { if (!td.querySelector('.crown')) { var c = document.createElement('span'); c.className = 'crown'; c.textContent = '\u{1F451}'; td.insertBefore(c, td.firstChild); } }
      else { var old = td.querySelector('.crown'); if (old) old.remove(); }
      tr.querySelector('.rk').textContent = anyPlayed && rankOf[pi] < 3 ? MEDALS[rankOf[pi]] : '';
    });

    // current round: first one not fully entered
    var now = -1;
    for (var r = 0; r < 8; r++) { if (!roundComplete(r)) { now = r; break; } }
    $('board').querySelectorAll('thead th[data-hr]').forEach(function (th) { th.classList.toggle('now', +th.dataset.hr === now); });
    $('board').querySelectorAll('td[data-r]').forEach(function (td) { td.classList.toggle('now', +td.dataset.r === now); });

    renderStandings(order, finals, rankOf, anyPlayed, MEDALS);
    renderWinner(finals, now === -1);
  }

  function renderStandings(order, finals, rankOf, anyPlayed, MEDALS) {
    var box = $('standings');
    box.classList.toggle('hidden', !anyPlayed);
    box.innerHTML = '';
    order.forEach(function (pi) {
      var chip = document.createElement('div');
      chip.className = 'stand' + (rankOf[pi] === 0 ? ' first' : '');
      chip.style.setProperty('--pc', COLORS[pi % COLORS.length]);
      var medal = document.createElement('span'); medal.className = 'medal'; medal.textContent = rankOf[pi] < 3 ? MEDALS[rankOf[pi]] : (rankOf[pi] + 1);
      var av = document.createElement('span'); av.className = 'avatar'; av.textContent = initial(game.names[pi]);
      var txt = document.createElement('div');
      var nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = game.names[pi];
      var pts = document.createElement('div'); pts.className = 'pts ' + (finals[pi] > 0 ? 'pos' : finals[pi] < 0 ? 'neg' : 'zero'); pts.textContent = finals[pi] + ' pts';
      txt.appendChild(nm); txt.appendChild(pts);
      chip.appendChild(medal); chip.appendChild(av); chip.appendChild(txt);
      box.appendChild(chip);
    });
  }

  function renderWinner(finals, allDone) {
    var w = $('winner');
    if (!allDone) { w.classList.add('hidden'); lastWinnerKey = null; return; }
    var best = Math.max.apply(null, finals);
    var winners = game.names.filter(function (_, i) { return finals[i] === best; });
    var key = winners.join('|') + '|' + best;
    w.classList.remove('hidden');
    w.textContent = '\u{1F3C6} ' + winners.join(' & ') + (winners.length > 1 ? ' tie! ' : ' wins! ');
    var s = document.createElement('small'); s.textContent = best + ' points'; w.appendChild(s);
    if (!firstPaint && key !== lastWinnerKey) confetti();
    lastWinnerKey = key;
  }

  function confetti() {
    var box = $('confetti');
    for (var i = 0; i < 70; i++) {
      var p = document.createElement('i');
      p.style.left = Math.random() * 100 + '%';
      p.style.background = COLORS[i % COLORS.length];
      p.style.animationDuration = (2 + Math.random() * 2.2) + 's';
      p.style.animationDelay = (Math.random() * .6) + 's';
      p.style.transform = 'rotate(' + Math.random() * 360 + 'deg)';
      box.appendChild(p);
    }
    setTimeout(function () { box.innerHTML = ''; }, 5200);
  }

  $('board').addEventListener('input', function (e) {
    var el = e.target;
    if (!el.dataset || !el.dataset.k) return;
    var pi = +el.dataset.pi, r = +el.dataset.r, k = el.dataset.k;
    var digits = el.value.replace(/\D/g, '');
    var val = digits === '' ? null : parseInt(digits, 10);
    var max = ROUNDS[r];
    if (val !== null && val > max) val = max;          // cannot exceed cards dealt this round
    el.value = val === null ? '' : val;
    game[k][pi][r] = val;
    save();
    refreshTotals();
  });
  $('board').addEventListener('click', function (e) {
    var btn = e.target.closest && e.target.closest('.lockbtn');
    if (btn) {
      var r = +btn.dataset.r;
      if (game.unlocked[r]) { game.unlocked[r] = false; save(); refreshTotals(); }
      else askAdmin(r);
      return;
    }
    var el = e.target;
    if (el.matches && el.matches('input.p, input.a') && el.readOnly) askAdmin(+el.dataset.r, el.dataset.k);
  });

  /* ---------- admin override ---------- */
  var pendingRound = null, pendingKind = 'p';
  function askAdmin(r, kind) {
    pendingRound = r;
    pendingKind = kind || 'p';
    var what = ROUNDS[r] + '-card ' + (pendingKind === 'a' ? 'actuals before all prophecies are in' : 'prophecies');
    $('admin-title').textContent = game.pwHash ? 'Admin override' : 'Set an admin password';
    $('admin-msg').textContent = game.pwHash
      ? 'Enter the admin password to edit the ' + what + '.'
      : 'This game has no admin password yet. Choose one to unlock the ' + what + '.';
    $('admin-input').value = '';
    $('admin-err').classList.add('hidden');
    $('admin-dlg').showModal();
    $('admin-input').focus();
  }
  $('admin-cancel').addEventListener('click', function () { $('admin-dlg').close(); });
  $('admin-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var pw = $('admin-input').value;
    if (!pw || pendingRound === null) return;
    var r = pendingRound;
    function unlock() {
      game.unlocked[r] = true;
      save();
      $('admin-dlg').close();
      refreshTotals();
      var first = $('board').querySelector('input[data-r="' + r + '"][data-k="' + pendingKind + '"]');
      if (first) first.focus();
    }
    if (!game.pwHash) {
      game.salt = newSalt();
      hashPw(pw, game.salt).then(function (h) { game.pwHash = h; unlock(); });
      return;
    }
    hashPw(pw, game.salt).then(function (h) {
      if (h === game.pwHash) unlock();
      else { $('admin-err').classList.remove('hidden'); $('admin-input').select(); }
    });
  });
  $('board').addEventListener('focusin', function (e) { if (e.target.select) e.target.select(); });

  /* ---------- view ---------- */
  function show(which) {
    $('setup').classList.toggle('hidden', which !== 'setup');
    $('game').classList.toggle('hidden', which !== 'game');
  }

  $('start').addEventListener('click', startGame);
  $('reset').addEventListener('click', function () {
    if (!confirm('Start a new game? This clears the current scores.')) return;
    try { localStorage.removeItem(STORE); } catch (e) {}
    game = null;
    lastWinnerKey = null;
    $('names').innerHTML = '';
    renderSetup();
    show('setup');
  });

  game = load();
  if (game) { show('game'); renderBoard(); }
  else { renderSetup(); show('setup'); }
})();
</script>
</body>
</html>
