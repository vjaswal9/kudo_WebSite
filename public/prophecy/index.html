<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#0f0e0d">
<title>Prophecy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --bg: #0f0e0d;
    --surface: #171513;
    --surface2: #1f1c19;
    --ink: #f3ede2;
    --muted: #9a9184;
    --line: #3a352e;
    --soft-line: #2a2622;
    --gold: #c9a96a;
    --gold-soft: rgba(201,169,106,.14);
    --pos: #93b79f;
    --neg: #c98a8a;
    --on-gold: #1a1408;
    --serif: "Playfair Display", Georgia, "Times New Roman", serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    color: var(--ink);
    background: radial-gradient(900px 480px at 50% -12%, rgba(201,169,106,.09), transparent 65%), var(--bg);
    background-attachment: fixed;
    font: 16px/1.4 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: env(safe-area-inset-top) 16px calc(28px + env(safe-area-inset-bottom));
    -webkit-text-size-adjust: 100%;
  }

  /* ---------- title ---------- */
  .brand { display: flex; align-items: baseline; gap: 14px; margin: 24px 0 6px; }
  h1 { margin: 0; font-family: var(--serif); font-size: 34px; line-height: 1; letter-spacing: .14em; text-transform: uppercase; font-weight: 500; color: var(--ink); }
  .suits { font-size: 15px; letter-spacing: .3em; color: var(--gold); white-space: nowrap; }
  .sub { font-family: var(--serif); font-style: italic; color: var(--ink); font-size: 21px; font-weight: 500; margin: 6px 0 22px; }

  /* ---------- setup ---------- */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 24px; max-width: 480px; }
  label.field { display: block; margin: 22px 0 8px; color: var(--gold); font-size: 11px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; }
  label.field:first-child { margin-top: 0; }
  .counts { display: flex; flex-wrap: wrap; gap: 8px; }
  .counts button {
    width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--line); background: transparent;
    color: var(--ink); font: inherit; font-size: 16px; font-weight: 600; cursor: pointer; transition: border-color .15s, background .15s;
  }
  .counts button:hover { border-color: var(--gold); }
  .counts button[aria-pressed="true"] { background: var(--gold); border-color: var(--gold); color: var(--on-gold); }
  .names { display: grid; gap: 10px; }
  .names .nrow { display: flex; align-items: center; gap: 12px; }
  .names input, .pw {
    width: 100%; padding: 13px 14px; font: inherit; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink);
  }
  .names input::placeholder { color: #6a6358; }
  .names input:focus, .pw:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-soft); }
  .primary {
    margin-top: 26px; width: 100%; padding: 15px; border: 0; border-radius: 10px; font: inherit; font-size: 14px; font-weight: 700;
    letter-spacing: .14em; text-transform: uppercase; color: var(--on-gold); cursor: pointer; background: var(--gold); transition: filter .15s;
  }
  .primary:hover { filter: brightness(1.08); }
  .hint { color: var(--muted); font-size: 13px; margin: 8px 0 0; }
  .err { color: var(--neg); font-size: 14px; font-weight: 600; margin: 8px 0 0; }
  .ghost {
    padding: 9px 16px; border-radius: 10px; border: 1px solid var(--line); background: transparent; white-space: nowrap;
    color: var(--ink); font: inherit; font-size: 13px; font-weight: 600; letter-spacing: .04em; cursor: pointer; transition: border-color .15s;
  }
  .ghost:hover { border-color: var(--gold); }

  /* ---------- game header ---------- */
  .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 14px 0 10px; }
  .toolbar .brand { margin: 0; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 0 0 16px; font-size: 12px; color: var(--muted); letter-spacing: .04em; }
  .legend b { color: var(--ink); font-weight: 600; }

  /* ---------- standings ---------- */
  #standings { display: flex; gap: 10px; overflow-x: auto; padding: 2px 2px 14px; margin: 0 -2px; scrollbar-width: none; }
  #standings::-webkit-scrollbar { display: none; }
  .stand { flex: none; display: flex; align-items: center; gap: 10px; padding: 8px 16px 8px 10px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
  .stand .medal { font-family: var(--serif); font-size: 15px; color: var(--muted); min-width: 16px; text-align: center; }
  .stand .nm { font-weight: 600; line-height: 1.15; max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stand .pts { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--muted); }
  .stand .pts.pos { color: var(--pos); } .stand .pts.neg { color: var(--neg); }
  .stand.first { border-color: var(--gold); }
  .stand.first .medal { color: var(--gold); }
  .avatar {
    flex: none; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center;
    font-family: var(--serif); font-weight: 500; font-size: 15px; color: var(--gold); border: 1px solid var(--gold); background: transparent;
  }

  /* ---------- winner ---------- */
  #winner { text-align: center; margin: 0 0 16px; padding: 18px 16px; border-radius: 14px; border: 1px solid var(--gold); background: var(--gold-soft); }
  #winner .lbl { display: block; color: var(--gold); font-size: 11px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; }
  #winner .who2 { display: block; font-family: var(--serif); font-size: 26px; margin: 4px 0 2px; }
  #winner small { color: var(--muted); font-size: 13px; }

  /* ---------- table ---------- */
  .wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
  table { border-collapse: separate; border-spacing: 0; width: 100%; }
  th, td { border-right: 1px solid var(--soft-line); border-bottom: 1px solid var(--soft-line); padding: 0; }
  thead th {
    background: var(--surface2); color: var(--ink); padding: 12px 0 9px; text-align: center; position: relative;
    font-family: var(--serif); font-size: 24px; font-weight: 500; line-height: 1; border-bottom: 1px solid var(--line);
  }
  thead th .suit { position: absolute; top: 6px; left: 8px; font-family: inherit; font-size: 10px; color: var(--gold); opacity: .7; }
  thead th small { display: block; margin-top: 5px; font-family: Inter, sans-serif; font-size: 9px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  thead th.corner { position: sticky; left: 0; z-index: 3; text-align: left; padding-left: 16px; font-family: Inter, sans-serif; font-size: 10px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); min-width: 132px; }
  thead th.now { box-shadow: inset 0 2px 0 var(--gold); background: var(--gold-soft); }
  thead th.now small { color: var(--gold); font-size: 0; }
  thead th.now small::before { content: "Now"; font-size: 9px; }
  thead th.final { min-width: 86px; color: var(--gold); border-left: 1px solid var(--line); border-right: 0; }
  th.name { position: sticky; left: 0; z-index: 2; background: var(--surface); text-align: left; padding: 0 12px 0 16px; border-right: 1px solid var(--line); min-width: 132px; max-width: 170px; }
  .who { display: flex; align-items: center; gap: 10px; }
  .who .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .who .rk { margin-left: auto; font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .who .rk.first { color: var(--gold); }
  tr:last-child th.name, tr:last-child td { border-bottom: 0; }
  td.cell-td { min-width: 108px; transition: background .25s; }
  td.now { background: rgba(201,169,106,.04); }
  .cell { display: flex; height: 78px; position: relative; }
  .inputs { display: flex; flex-direction: column; width: 48px; flex: none; padding: 6px 0 6px 6px; gap: 4px; }
  .inputs input {
    flex: 1; min-height: 0; width: 100%; border: 1px solid var(--line); background: var(--bg); color: var(--ink);
    text-align: center; font: inherit; font-size: 17px; font-weight: 600; padding: 0; border-radius: 8px;
    -moz-appearance: textfield; appearance: textfield; transition: border-color .15s, box-shadow .15s;
  }
  .inputs input::-webkit-outer-spin-button, .inputs input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .inputs input.a { color: var(--gold); }
  .inputs input:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-soft); }
  .inputs input::placeholder { color: #5f584d; font-weight: 600; font-size: 9px; letter-spacing: .12em; text-transform: uppercase; }
  .inputs input[readonly] { cursor: pointer; }
  .inputs input.p[readonly] { background: var(--surface2); }
  .inputs input.a[readonly] { background: repeating-linear-gradient(135deg, transparent 0 5px, rgba(255,255,255,.04) 5px 6px), var(--bg); opacity: .5; }
  .total { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-variant-numeric: tabular-nums; }
  .total .tv { font-size: 20px; font-weight: 600; line-height: 1; }
  .total .delta { font-size: 10px; font-weight: 600; letter-spacing: .04em; color: var(--muted); }
  .total.pos .tv { color: var(--pos); } .total.neg .tv { color: var(--neg); }
  .total.pop { animation: pop .35s ease-out; }
  @keyframes pop { 0% { transform: scale(.85); opacity: .3; } 100% { transform: scale(1); opacity: 1; } }
  td.hit { background: rgba(147,183,159,.07); }
  td.miss { background: rgba(201,138,138,.07); }
  td.hit .cell::after { content: "\2713"; position: absolute; top: 3px; right: 6px; font-size: 10px; font-weight: 700; color: var(--pos); }
  td.final { min-width: 86px; text-align: center; font-size: 22px; font-weight: 600; border-left: 1px solid var(--line); border-right: 0; font-variant-numeric: tabular-nums; }
  td.final.pos { color: var(--pos); } td.final.neg { color: var(--neg); }
  td.final.leader { background: var(--gold-soft); color: var(--gold); }
  td.final .crown { display: block; font-size: 14px; line-height: 1; margin-bottom: 3px; color: var(--gold); }
  .lockbtn {
    display: block; margin: 6px auto 0; padding: 2px 9px; font: inherit; font-size: 9px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase;
    border-radius: 99px; border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer;
  }
  .lockbtn:hover { border-color: var(--gold); color: var(--gold); }
  .lockbtn.open { border-color: var(--gold); color: var(--gold); }

  /* ---------- dialog ---------- */
  dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--ink); padding: 24px; width: min(92vw, 380px); }
  dialog::backdrop { background: rgba(8, 7, 6, .75); backdrop-filter: blur(3px); }
  dialog h2 { margin: 0 0 6px; font-family: var(--serif); font-weight: 500; font-size: 22px; }
  dialog p { margin: 0 0 12px; color: var(--muted); }
  dialog .row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; }
  dialog .primary { margin: 0; width: auto; padding: 10px 20px; font-size: 12px; }
  .hidden { display: none !important; }

  @media (max-width: 480px) {
    h1 { font-size: 26px; } .suits { display: none; }
    th.name, thead th.corner { min-width: 92px; max-width: 108px; padding-left: 10px; padding-right: 6px; }
    .who { gap: 7px; } .who .avatar { width: 26px; height: 26px; font-size: 13px; } .who .nm { font-size: 14px; }
    .who .rk { display: none; }
    td.cell-td { min-width: 100px; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<section id="setup" class="hidden">
  <div class="brand"><h1>Prophecy</h1><span class="suits" aria-hidden="true">&spades; &hearts; &clubs; &diams;</span></div>
  <p class="sub">Set up the game Gay Boyeeee!</p>
  <div class="card">
    <label class="field" id="count-label">How many players?</label>
    <div class="counts" id="counts" role="group" aria-labelledby="count-label"></div>
    <label class="field">Names</label>
    <div class="names" id="names"></div>
    <label class="field" for="admin-pw">Admin password</label>
    <input class="pw" id="admin-pw" type="password" autocomplete="new-password" maxlength="64">
    <p class="hint">Needed to change a prophecy after it locks. Only the scorekeeper should know it.</p>
    <p class="err hidden" id="setup-err" role="alert"></p>
    <button class="primary" id="start" type="button">Deal me in</button>
  </div>
</section>

<section id="game" class="hidden">
  <div class="toolbar">
    <div class="brand"><h1>Prophecy</h1><span class="suits" aria-hidden="true">&spades; &hearts; &clubs; &diams;</span></div>
    <button class="ghost" id="reset" type="button">New game</button>
  </div>
  <div class="legend" aria-label="How to read each box">
    <span><b>Top</b> prophecy</span><span><b>Bottom</b> actual</span><span><b>Right</b> running total</span>
  </div>
  <div id="winner" class="hidden"></div>
  <div id="standings" aria-label="Standings"></div>
  <div class="wrap"><table id="board"></table></div>
</section>

<dialog id="admin-dlg">
  <form id="admin-form">
    <h2 id="admin-title">Admin override</h2>
    <p id="admin-msg"></p>
    <input class="pw" id="admin-input" type="password" autocomplete="off" maxlength="64" aria-label="Admin password">
    <p class="err hidden" id="admin-err" role="alert">Wrong password</p>
    <div class="row">
      <button class="ghost" id="admin-cancel" type="button">Cancel</button>
      <button class="primary" type="submit">Unlock</button>
    </div>
  </form>
</dialog>

<script>
(function () {
  var STORE = 'prophecy-game-v1';
  var ROUNDS = [8, 7, 6, 5, 4, 3, 2, 1];
  var MAX_PLAYERS = 8, MIN_PLAYERS = 2;
  var SUITS = ['♠', '♥', '♣', '♦'];   // spade, heart, club, diamond

  var game = null;       // { names: [], p: [[...8]], a: [[...8]], salt, pwHash, unlocked: [8] }  null = not yet entered
  var setupCount = 4;
  var firstPaint = true;

  var $ = function (id) { return document.getElementById(id); };

  function save() { try { localStorage.setItem(STORE, JSON.stringify(game)); } catch (e) {} }
  function load() {
    try {
      var g = JSON.parse(localStorage.getItem(STORE));
      if (g && g.names && g.p && g.a) return g;
    } catch (e) {}
    return null;
  }

  // Exact hit: +10 x prophecy. Miss: -10 x |difference|.
  function roundScore(p, a) { return p === a ? 10 * p : -10 * Math.abs(p - a); }

  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function fmt(n) { return (n > 0 ? '+' : '') + n; }
  function initial(name) { return (name.trim().charAt(0) || '?').toUpperCase(); }

  /* ---------- setup ---------- */
  function renderSetup() {
    var counts = $('counts');
    counts.innerHTML = '';
    for (var n = MIN_PLAYERS; n <= MAX_PLAYERS; n++) {
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = n;
      b.setAttribute('aria-pressed', n === setupCount);
      b.addEventListener('click', (function (n) { return function () { setupCount = n; renderSetup(); }; })(n));
      counts.appendChild(b);
    }
    var names = $('names');
    var existing = Array.prototype.map.call(names.querySelectorAll('input'), function (i) { return i.value; });
    names.innerHTML = '';
    for (var i = 0; i < setupCount; i++) {
      var row = document.createElement('div');
      row.className = 'nrow';
      var av = document.createElement('span');
      av.className = 'avatar';
      av.textContent = i + 1;
      var inp = document.createElement('input');
      inp.type = 'text';
      inp.maxLength = 20;
      inp.placeholder = 'Player ' + (i + 1);
      inp.autocomplete = 'off';
      inp.setAttribute('aria-label', 'Player ' + (i + 1) + ' name');
      inp.value = existing[i] || '';
      row.appendChild(av);
      row.appendChild(inp);
      names.appendChild(row);
    }
  }

  // Salted SHA-256 of the admin password. The password itself is never stored.
  function hashPw(pw, salt) {
    var data = salt + ':' + pw;
    if (window.crypto && crypto.subtle && window.TextEncoder) {
      return crypto.subtle.digest('SHA-256', new TextEncoder().encode(data)).then(function (b) {
        return Array.prototype.map.call(new Uint8Array(b), function (x) { return ('0' + x.toString(16)).slice(-2); }).join('');
      });
    }
    var h = 5381;
    for (var i = 0; i < data.length; i++) h = ((h << 5) + h + data.charCodeAt(i)) | 0;
    return Promise.resolve('f' + h);
  }
  function newSalt() { return Math.random().toString(36).slice(2) + Date.now().toString(36); }

  function startGame() {
    var pw = $('admin-pw').value;
    var err = $('setup-err');
    if (!pw) { err.textContent = 'Choose an admin password.'; err.classList.remove('hidden'); $('admin-pw').focus(); return; }
    err.classList.add('hidden');
    var inputs = $('names').querySelectorAll('input');
    var names = Array.prototype.map.call(inputs, function (inp, i) { return inp.value.trim() || ('Player ' + (i + 1)); });
    var salt = newSalt();
    hashPw(pw, salt).then(function (hash) {
      game = { names: names, p: [], a: [], salt: salt, pwHash: hash, unlocked: Array(8).fill(false) };
      names.forEach(function () { game.p.push(Array(8).fill(null)); game.a.push(Array(8).fill(null)); });
      $('admin-pw').value = '';
      save();
      show('game');
      renderBoard();
    });
  }

  /* ---------- board ---------- */
  function totals(pi) {
    // running totals across completed rounds, in play order (8 down to 1)
    var run = 0, out = [];
    for (var r = 0; r < 8; r++) {
      var p = game.p[pi][r], a = game.a[pi][r];
      if (p !== null && a !== null) { run += roundScore(p, a); out.push(run); }
      else out.push(null);
    }
    return { cells: out, final: run };
  }

  function renderBoard() {
    var t = $('board');
    var html = '<thead><tr><th class="corner">Players</th>';
    ROUNDS.forEach(function (c, r) {
      var red = (r % 4 === 1 || r % 4 === 3) ? ' r' : '';
      html += '<th scope="col" data-hr="' + r + '"><span class="suit' + red + '" aria-hidden="true">' + SUITS[r % 4] + '</span>' + c +
        '<small>cards</small><button type="button" class="lockbtn hidden" data-r="' + r + '"></button></th>';
    });
    html += '<th class="final" scope="col">Total</th></tr></thead><tbody>';
    game.names.forEach(function (name, pi) {
      html += '<tr data-pi="' + pi + '"><th class="name" scope="row"></th>';
      ROUNDS.forEach(function (c, r) {
        html += '<td class="cell-td" data-r="' + r + '"><div class="cell">' +
          '<div class="inputs">' +
          '<input class="p" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" placeholder="pro" aria-label="' + esc(name) + ' prophecy, ' + c + ' cards" data-pi="' + pi + '" data-r="' + r + '" data-k="p">' +
          '<input class="a" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" placeholder="act" aria-label="' + esc(name) + ' actual, ' + c + ' cards" data-pi="' + pi + '" data-r="' + r + '" data-k="a">' +
          '</div><div class="total"></div></div></td>';
      });
      html += '<td class="final"></td></tr>';
    });
    html += '</tbody>';
    t.innerHTML = html;

    // names via textContent (avoid injecting HTML)
    t.querySelectorAll('tbody tr').forEach(function (tr) {
      var pi = +tr.dataset.pi;
      var th = tr.querySelector('th.name');
      th.title = game.names[pi];
      var who = document.createElement('div'); who.className = 'who';
      var av = document.createElement('span'); av.className = 'avatar'; av.textContent = initial(game.names[pi]);
      var nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = game.names[pi];
      var rk = document.createElement('span'); rk.className = 'rk';
      who.appendChild(av); who.appendChild(nm); who.appendChild(rk);
      th.appendChild(who);
      ROUNDS.forEach(function (c, r) {
        var p = game.p[pi][r], a = game.a[pi][r];
        tr.querySelector('input[data-r="' + r + '"][data-k="p"]').value = p === null ? '' : p;
        tr.querySelector('input[data-r="' + r + '"][data-k="a"]').value = a === null ? '' : a;
      });
    });
    firstPaint = true;
    refreshTotals();
    firstPaint = false;
  }

  function prophecyComplete(r) { return game.p.every(function (row) { return row[r] !== null; }); }
  function roundComplete(r) { return prophecyComplete(r) && game.a.every(function (row) { return row[r] !== null; }); }

  // Actuals stay read-only until every prophecy for the round is in; then the prophecies lock.
  function refreshLocks() {
    if (!game.unlocked) game.unlocked = Array(8).fill(false);
    ROUNDS.forEach(function (c, r) {
      var done = prophecyComplete(r);
      var un = !!game.unlocked[r];
      var pLocked = done && !un;
      $('board').querySelectorAll('input[data-r="' + r + '"][data-k="p"]').forEach(function (el) { el.readOnly = pLocked; });
      $('board').querySelectorAll('input[data-r="' + r + '"][data-k="a"]').forEach(function (el) {
        el.readOnly = !(done || un);
        el.placeholder = (done || un) ? 'act' : '';
      });
      var btn = $('board').querySelector('.lockbtn[data-r="' + r + '"]');
      btn.classList.toggle('hidden', !(pLocked || un));
      btn.classList.toggle('open', un);
      btn.textContent = un ? 'Re-lock' : 'Locked';
      btn.title = un ? 'Lock this round again' : 'Enter the admin password to edit prophecies';
    });
  }

  function refreshTotals() {
    refreshLocks();
    var finals = [];
    game.names.forEach(function (_, pi) {
      var tr = $('board').querySelector('tr[data-pi="' + pi + '"]');
      var tt = totals(pi);
      finals.push(tt.final);
      ROUNDS.forEach(function (c, r) {
        var td = tr.querySelector('td[data-r="' + r + '"]');
        var box = td.querySelector('.total');
        var v = tt.cells[r];
        td.classList.remove('hit', 'miss');
        box.classList.remove('pos', 'neg');
        var sig = v === null ? '' : String(v) + '|' + game.p[pi][r] + '|' + game.a[pi][r];
        var changed = box.dataset.sig !== sig;
        box.dataset.sig = sig;
        if (v === null) { box.textContent = ''; return; }
        var d = roundScore(game.p[pi][r], game.a[pi][r]);
        box.innerHTML = '<span class="tv">' + v + '</span><span class="delta">' + fmt(d) + '</span>';
        if (v > 0) box.classList.add('pos'); else if (v < 0) box.classList.add('neg');
        td.classList.add(game.p[pi][r] === game.a[pi][r] ? 'hit' : 'miss');
        td.title = 'Round score ' + fmt(d);
        if (changed && !firstPaint) { box.classList.remove('pop'); void box.offsetWidth; box.classList.add('pop'); }
      });
      var fin = tr.querySelector('td.final');
      fin.textContent = tt.final;
      fin.classList.toggle('pos', tt.final > 0);
      fin.classList.toggle('neg', tt.final < 0);
    });

    var anyPlayed = game.p.some(function (row, pi) { return row.some(function (v, r) { return v !== null && game.a[pi][r] !== null; }); });
    var best = Math.max.apply(null, finals);
    var order = game.names.map(function (_, i) { return i; }).sort(function (x, y) { return finals[y] - finals[x] || x - y; });
    var rankOf = {};
    order.forEach(function (pi, i) { rankOf[pi] = i > 0 && finals[pi] === finals[order[i - 1]] ? rankOf[order[i - 1]] : i; });
    var MEDALS = ['1st', '2nd', '3rd'];

    game.names.forEach(function (_, pi) {
      var tr = $('board').querySelector('tr[data-pi="' + pi + '"]');
      var td = tr.querySelector('td.final');
      var lead = anyPlayed && finals[pi] === best;
      td.classList.toggle('leader', lead);
      if (lead) { if (!td.querySelector('.crown')) { var c = document.createElement('span'); c.className = 'crown'; c.textContent = '\u265B\uFE0E'; td.insertBefore(c, td.firstChild); } }
      else { var old = td.querySelector('.crown'); if (old) old.remove(); }
      var rk = tr.querySelector('.rk');
      rk.textContent = anyPlayed && rankOf[pi] < 3 ? MEDALS[rankOf[pi]] : '';
      rk.classList.toggle('first', anyPlayed && rankOf[pi] === 0);
    });

    // current round: first one not fully entered
    var now = -1;
    for (var r = 0; r < 8; r++) { if (!roundComplete(r)) { now = r; break; } }
    $('board').querySelectorAll('thead th[data-hr]').forEach(function (th) { th.classList.toggle('now', +th.dataset.hr === now); });
    $('board').querySelectorAll('td[data-r]').forEach(function (td) { td.classList.toggle('now', +td.dataset.r === now); });

    renderStandings(order, finals, rankOf, anyPlayed, MEDALS);
    renderWinner(finals, now === -1);
  }

  function renderStandings(order, finals, rankOf, anyPlayed, MEDALS) {
    var box = $('standings');
    box.classList.toggle('hidden', !anyPlayed);
    box.innerHTML = '';
    order.forEach(function (pi) {
      var chip = document.createElement('div');
      chip.className = 'stand' + (rankOf[pi] === 0 ? ' first' : '');
      var medal = document.createElement('span'); medal.className = 'medal'; medal.textContent = rankOf[pi] + 1;
      var av = document.createElement('span'); av.className = 'avatar'; av.textContent = initial(game.names[pi]);
      var txt = document.createElement('div');
      var nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = game.names[pi];
      var pts = document.createElement('div'); pts.className = 'pts ' + (finals[pi] > 0 ? 'pos' : finals[pi] < 0 ? 'neg' : 'zero'); pts.textContent = finals[pi] + ' pts';
      txt.appendChild(nm); txt.appendChild(pts);
      chip.appendChild(medal); chip.appendChild(av); chip.appendChild(txt);
      box.appendChild(chip);
    });
  }

  function renderWinner(finals, allDone) {
    var w = $('winner');
    if (!allDone) { w.classList.add('hidden'); return; }
    var best = Math.max.apply(null, finals);
    var winners = game.names.filter(function (_, i) { return finals[i] === best; });
    w.classList.remove('hidden');
    w.innerHTML = '<span class="lbl"></span><span class="who2"></span><small></small>';
    w.querySelector('.lbl').textContent = winners.length > 1 ? 'Joint winners' : 'Winner';
    w.querySelector('.who2').textContent = winners.join(' & ');
    w.querySelector('small').textContent = best + ' points';
  }

  $('board').addEventListener('input', function (e) {
    var el = e.target;
    if (!el.dataset || !el.dataset.k) return;
    var pi = +el.dataset.pi, r = +el.dataset.r, k = el.dataset.k;
    var digits = el.value.replace(/\D/g, '');
    var val = digits === '' ? null : parseInt(digits, 10);
    var max = ROUNDS[r];
    if (val !== null && val > max) val = max;          // cannot exceed cards dealt this round
    el.value = val === null ? '' : val;
    game[k][pi][r] = val;
    save();
    refreshTotals();
  });
  $('board').addEventListener('click', function (e) {
    var btn = e.target.closest && e.target.closest('.lockbtn');
    if (btn) {
      var r = +btn.dataset.r;
      if (game.unlocked[r]) { game.unlocked[r] = false; save(); refreshTotals(); }
      else askAdmin(r);
      return;
    }
    var el = e.target;
    if (el.matches && el.matches('input.p, input.a') && el.readOnly) askAdmin(+el.dataset.r, el.dataset.k);
  });

  /* ---------- admin override ---------- */
  var pendingRound = null, pendingKind = 'p';
  function askAdmin(r, kind) {
    pendingRound = r;
    pendingKind = kind || 'p';
    var what = ROUNDS[r] + '-card ' + (pendingKind === 'a' ? 'actuals before all prophecies are in' : 'prophecies');
    $('admin-title').textContent = game.pwHash ? 'Admin override' : 'Set an admin password';
    $('admin-msg').textContent = game.pwHash
      ? 'Enter the admin password to edit the ' + what + '.'
      : 'This game has no admin password yet. Choose one to unlock the ' + what + '.';
    $('admin-input').value = '';
    $('admin-err').classList.add('hidden');
    $('admin-dlg').showModal();
    $('admin-input').focus();
  }
  $('admin-cancel').addEventListener('click', function () { $('admin-dlg').close(); });
  $('admin-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var pw = $('admin-input').value;
    if (!pw || pendingRound === null) return;
    var r = pendingRound;
    function unlock() {
      game.unlocked[r] = true;
      save();
      $('admin-dlg').close();
      refreshTotals();
      var first = $('board').querySelector('input[data-r="' + r + '"][data-k="' + pendingKind + '"]');
      if (first) first.focus();
    }
    if (!game.pwHash) {
      game.salt = newSalt();
      hashPw(pw, game.salt).then(function (h) { game.pwHash = h; unlock(); });
      return;
    }
    hashPw(pw, game.salt).then(function (h) {
      if (h === game.pwHash) unlock();
      else { $('admin-err').classList.remove('hidden'); $('admin-input').select(); }
    });
  });
  $('board').addEventListener('focusin', function (e) { if (e.target.select) e.target.select(); });

  /* ---------- view ---------- */
  function show(which) {
    $('setup').classList.toggle('hidden', which !== 'setup');
    $('game').classList.toggle('hidden', which !== 'game');
  }

  $('start').addEventListener('click', startGame);
  $('reset').addEventListener('click', function () {
    if (!confirm('Start a new game? This clears the current scores.')) return;
    try { localStorage.removeItem(STORE); } catch (e) {}
    game = null;
    $('names').innerHTML = '';
    renderSetup();
    show('setup');
  });

  game = load();
  if (game) { show('game'); renderBoard(); }
  else { renderSetup(); show('setup'); }
})();
</script>
</body>
</html>
